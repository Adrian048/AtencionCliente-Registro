[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "triage-api"
version = "0.1.0"
description = "Backend for the support triage panel: lists AI-classified tickets and updates their state."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Adrián Hernández Zapata" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "itsdangerous>=2.2",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/triage_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and test passwords

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["triage_api"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["psycopg_pool.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["triage_api"]
branch = true
