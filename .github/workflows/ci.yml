name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: triage
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d triage"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: localhost
      PGPASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: triage
      API_DB_PASSWORD: ci-api
      TRIAGE_TEST_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/triage
      TRIAGE_TEST_API_DSN: postgresql://panel_api:ci-api@localhost:5432/triage
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Create schema and roles (same scripts as docker compose)
        run: |
          psql -v ON_ERROR_STOP=1 -U postgres -d triage -f ../db/init/01_schema.sql
          sh ../db/init/02_roles.sh
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov --cov-report=term-missing

  panel:
    name: Panel · types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  workflow:
    name: n8n workflow · structure & secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_workflow.py

  compose:
    name: docker compose · smoke test
    runs-on: ubuntu-latest
    needs: [api, panel]
    steps:
      - uses: actions/checkout@v4
      - name: Generate Docker secrets
        run: python scripts/generate_secrets.py --no-admin
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: curl --fail --silent http://127.0.0.1:8080/api/health
      - name: Panel requires login
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/tickets)" = "401"
      - name: Internal ingest endpoint is not exposed
        run: test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/internal/tickets)" = "404"
      - name: Secrets are not in environment variables
        run: |
          ! docker compose exec -T api env | grep -v "^GPG_KEY=" | grep -iE "secret|password|key"
      - if: always()
        run: docker compose logs && docker compose down -v
