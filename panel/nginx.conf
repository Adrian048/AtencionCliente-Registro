# Rate limits per client IP
limit_req_zone $binary_remote_addr zone=webhook:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Strict CSP: no inline scripts, no third-party resources, only same-origin requests.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Resolve upstreams through Docker's DNS at request time (not once at startup),
    # so recreating the api or n8n container doesn't leave nginx pointing at a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    set $n8n_upstream http://n8n:5678;
    set $n8n_webhook http://n8n:5678/webhook/soporte;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Public contact form (landing) -------------------------------------------
    # The browser never sees the webhook key: nginx adds it here, reading it from the
    # Docker secret at container start (docker/40-webhook-key.sh). Any X-Api-Key the
    # client sends is overwritten.
    location = /api/public/contacto {
        limit_except POST { deny all; }
        limit_req zone=webhook burst=3 nodelay;
        client_max_body_size 8k;

        # proxy_set_header at this level replaces the server-level ones: repeat them.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Never forward the panel session cookie or credentials to n8n
        # (it could end up stored in n8n's execution logs).
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        include /tmp/webhook-key.conf;
        proxy_pass $n8n_webhook;
    }

    # Direct webhook for integrations that hold the key themselves (e.g. scripts/send_samples.py).
    # Only this exact path is exposed; the n8n editor is never reachable through this proxy.
    location = /webhook/soporte {
        limit_except POST { deny all; }
        limit_req zone=webhook burst=3 nodelay;
        client_max_body_size 8k;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_pass $n8n_upstream;
    }

    # --- Panel API ---------------------------------------------------------------
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        client_max_body_size 1k;
        proxy_pass $api_upstream;
    }

    # n8n -> API ingest endpoint: internal network only, never proxied
    location /api/internal/ {
        return 404;
    }

    location /api/ {
        client_max_body_size 16k;
        proxy_pass $api_upstream;
    }

    # --- Static pages ------------------------------------------------------------
    # Private management panel
    location = /panel {
        return 301 /panel/;
    }
    location /panel/ {
        try_files $uri /panel/index.html;
    }

    # Public landing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
